<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陶林伟 & 肖佩韦 · 婚礼请柬</title>
<style>
  :root{
    --paper:#efe8d8;
    --ink:#3a2e26;
    --red:#7a1f1f;
    --red-soft:#8f2a2a;
    --line:#c9b998;
    --brush:"STKaiti","Kaiti SC","KaiTi","Xingkai SC","STXingkai","Noto Serif SC",serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    background:#d8cfb8;
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:24px 12px;
  }
  .card{
    position:relative;
    width:100%;
    max-width:560px;
    background:var(--paper);
    border:1px solid var(--ink);
    outline:1px solid var(--ink);
    outline-offset:-6px;
    padding:20px;
    text-align:center;
  }
  .invitation-image{
    display:block;
    width:100%;
    height:auto;
    margin:0 0 28px;
  }

  .parade{
    position:relative;
    height:56px;
    margin:0 0 8px;
    overflow:hidden;
  }
  .parade .sprite{
    position:absolute;
    bottom:2px;
    left:-70px;
    width:54px;
    animation:walk-across var(--dur) linear infinite;
    animation-delay:var(--delay);
    animation-fill-mode:backwards;
  }
  .parade .sprite.small{width:38px;}
  .parade .sprite svg{
    width:100%;height:auto;
    fill:none;
    stroke:var(--red-soft);
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    animation:bob .5s ease-in-out infinite alternate;
  }
  @keyframes walk-across{
    0%{left:-70px;}
    100%{left:calc(100% + 70px);}
  }
  @keyframes bob{
    0%{transform:translateY(0);}
    100%{transform:translateY(-2px);}
  }
  .parade .legs-a{animation:leg-swap-a .7s steps(1) infinite;}
  .parade .legs-b{animation:leg-swap-b .7s steps(1) infinite;}
  @keyframes leg-swap-a{0%,49%{opacity:1;} 50%,100%{opacity:0;}}
  @keyframes leg-swap-b{0%,49%{opacity:0;} 50%,100%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){
    .parade .sprite{animation:none; display:none;}
  }

  .rsvp{
    margin-top:20px;
    padding-top:30px;
    border-top:1px dashed var(--line);
    text-align:left;
  }
  .rsvp h2{
    font-family:var(--brush);
    text-align:center;
    font-size:19px;
    letter-spacing:4px;
    margin:0 0 6px;
    color:var(--red);
  }
  .rsvp .deadline{
    text-align:center;
    font-size:13px;
    color:#6b5c46;
    margin:0 0 20px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    margin-bottom:6px;
    color:var(--ink);
  }
  .field input,.field select,.field textarea{
    width:100%;
    padding:9px 10px;
    font-size:16px;
    font-family:inherit;
    border:1px solid var(--line);
    background:#fbf8f0;
    color:var(--ink);
    border-radius:2px;
    -webkit-appearance:none;
    appearance:none;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:flex;gap:12px;}
  .row2 .field{flex:1;}
  .submit-btn{
    display:block;
    width:100%;
    margin-top:6px;
    padding:12px;
    background:var(--red);
    color:#f5ecdc;
    border:none;
    font-size:15px;
    letter-spacing:4px;
    font-family:inherit;
    cursor:pointer;
    border-radius:2px;
  }
  .submit-btn:active{background:var(--red-soft);}
  .rsvp-note{
    font-size:12px;
    color:#6b5c46;
    text-align:center;
    margin-top:12px;
    line-height:1.6;
  }
  .success-msg{
    display:none;
    text-align:center;
    color:var(--red);
    font-size:14px;
    margin-top:14px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="invitation-image" src="images/invitation.jpg" alt="陶林伟 & 肖佩韦 婚礼请柬，2026.10.17 丙午年九月初八 星期六，松江广富林希尔顿酒店会议中心一楼大宴会厅">

    <div class="parade" aria-hidden="true">
      <div class="sprite" style="--dur:16s; --delay:0s;" title="英短蓝白">
        <svg viewBox="0 0 60 46"><ellipse cx="22" cy="28" rx="15" ry="11" transform="rotate(-6 22 28)"/><circle cx="44" cy="17" r="10"/><path d="M35,9 Q37,2 42,6 Q40,10 35,9 Z"/><path d="M47,6 Q52,2 54,9 Q49,10 47,6 Z"/><path d="M40,17 q2,-3 4,0"/><path d="M47,17 q2,-3 4,0"/><path d="M44,20 l-1.5,2 h3 Z"/><path d="M38,23 Q36,26 39,28"/><path d="M50,22 Q52,25 49,27"/><path d="M48,22 L56,20 M48,24 L56,26"/><path d="M34,25 Q26,33 16,35"/><path d="M6,27 Q2,23 5,18 Q7,21 9,24"/><path d="M12,38 Q10,42 9,45"/><path d="M18,39 Q19,43 20,46"/><path d="M28,39 Q27,43 26,46"/><path d="M34,38 Q36,42 37,45"/></svg>
      </div>
      <div class="sprite" style="--dur:20s; --delay:5s; width:76px;" title="陶林伟 & 肖佩韦">
        <svg viewBox="0 0 90 50">
          <circle cx="18" cy="10" r="7"/>
          <path d="M12,6 Q18,2 24,6"/>
          <path d="M11,17 Q18,13 25,17 L25,33 Q18,36 11,33 Z"/>
          <path d="M13,17 L18,21 L23,17"/>
          <path d="M18,21 L18,30"/>
          <path d="M23,21 Q29,23 33,25"/>
          <g class="legs-a">
            <path d="M14,33 Q11,38 9,44 M9,44 L6,45"/>
            <path d="M20,33 Q23,38 25,42 M25,42 L28,42"/>
          </g>
          <g class="legs-b">
            <path d="M20,33 Q23,38 25,44 M25,44 L28,45"/>
            <path d="M14,33 Q11,38 9,42 M9,42 L6,42"/>
          </g>

          <circle cx="52" cy="10" r="7"/>
          <path d="M45,8 Q41,17 46,23"/>
          <path d="M59,8 Q63,17 58,23"/>
          <path d="M52,17 Q40,27 37,40 Q52,45 67,40 Q64,27 52,17 Z"/>
          <path d="M45,25 Q52,28 59,25"/>
          <path d="M48,21 Q42,23 38,25"/>
          <circle cx="67" cy="25" r="1.4"/><circle cx="69" cy="27" r="1.4"/><circle cx="67" cy="28" r="1.4"/>
          <g class="legs-a">
            <path d="M45,40 Q43,44 42,47"/>
            <path d="M59,40 Q61,44 62,47"/>
          </g>
          <g class="legs-b">
            <path d="M45,40 Q44,44 45,47"/>
            <path d="M59,40 Q60,44 59,47"/>
          </g>
          <line x1="33" y1="25" x2="38" y2="25"/>
        </svg>
      </div>
      <div class="sprite" style="--dur:14s; --delay:9s;" title="金吉拉白">
        <svg viewBox="0 0 60 46"><path d="M9,27 Q6,22 9,17 M12,20 Q9,15 12,10 M31,15 Q30,10 33,6 M35,14 Q36,9 39,6"/><ellipse cx="23" cy="28" rx="16" ry="10" transform="rotate(-6 23 28)"/><circle cx="44" cy="17" r="10.5"/><path d="M38,9 Q39,5 42,7"/><path d="M49,7 Q52,5 53,9"/><circle cx="41" cy="16" r="2.1"/><circle cx="48" cy="16" r="2.1"/><circle cx="41.6" cy="15.4" r="0.6" fill="var(--red-soft)" stroke="none"/><circle cx="48.6" cy="15.4" r="0.6" fill="var(--red-soft)" stroke="none"/><path d="M43,20 h2"/><path d="M48,21 L57,20 M48,23 L57,25"/><path d="M2,30 Q-6,20 2,10 Q10,6 14,12 Q8,16 8,24 Q10,28 4,32 Z"/><path d="M12,38 Q10,42 9,45"/><path d="M18,39 Q19,43 20,46"/><path d="M28,39 Q27,43 26,46"/><path d="M34,38 Q36,42 37,45"/></svg>
      </div>
      <div class="sprite small" style="--dur:12s; --delay:2.5s;" title="美短">
        <svg viewBox="0 0 60 46"><ellipse cx="22" cy="28" rx="16" ry="10" transform="rotate(-8 22 28)"/><circle cx="44" cy="16" r="10"/><path d="M36,8 L40,2 L43,9 Z"/><path d="M46,7 L50,1 L52,9 Z"/><path d="M40,8 L41,11 M43,7 L43,11 M46,8 L45,11"/><path d="M40,16 q2,-3 4,0"/><path d="M47,16 q2,-3 4,0"/><path d="M44,19 l-1.5,2 h3 Z"/><path d="M48,21 L56,19 M48,23 L56,25"/><path d="M16,22 Q20,20 24,22"/><path d="M14,28 Q18,26 22,28"/><path d="M18,34 Q22,32 26,34"/><path d="M6,26 Q-2,18 4,10 Q8,6 12,10"/><path d="M5,16 Q7,17 6,19"/><path d="M2,21 Q4,22 3,24"/><path d="M12,37 Q10,41 9,44"/><path d="M18,38 Q19,42 20,45"/><path d="M28,38 Q27,42 26,45"/><path d="M34,37 Q36,41 37,44"/></svg>
      </div>
    </div>

    <div class="rsvp">
      <h2>出席登记</h2>
      <p class="deadline">为方便统计与订房，请于 2026 年 8 月 30 日前完成登记</p>
      <form id="rsvpForm">
        <div class="field">
          <label for="name">姓名</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="row2">
          <div class="field">
            <label for="attend">是否出席</label>
            <select id="attend" name="attend">
              <option value="出席">出席</option>
              <option value="不出席">不出席</option>
            </select>
          </div>
          <div class="field">
            <label for="count">出席人数</label>
            <input type="number" id="count" name="count" min="1" value="1">
          </div>
        </div>
        <div class="field">
          <label for="city">所在城市</label>
          <input type="text" id="city" name="city" value="上海">
        </div>
        <div class="field">
          <label for="note">备注</label>
          <textarea id="note" name="note" placeholder="如有饮食禁忌或其他需要告知的事项，请在此留言"></textarea>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">提 交 登 记</button>
      </form>
      <p class="success-msg" id="successMsg"></p>
      <p class="rsvp-note">登记信息将自动保存；如需修改，用同样的姓名重新提交一次即可覆盖之前的登记</p>
    </div>
  </div>

<script>
  var form = document.getElementById('rsvpForm');
  var submitBtn = document.getElementById('submitBtn');
  var successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var payload = {
      name: document.getElementById('name').value.trim(),
      attend: document.getElementById('attend').value,
      count: document.getElementById('count').value,
      city: document.getElementById('city').value.trim(),
      note: document.getElementById('note').value.trim()
    };

    submitBtn.disabled = true;
    submitBtn.textContent = '提 交 中 ...';
    successMsg.style.color = '';
    successMsg.style.display = 'none';

    fetch('/api/rsvp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data.ok) {
          successMsg.textContent = data.mode === 'updated'
            ? '已更新您的登记信息，感谢回复！'
            : '登记成功，感谢回复！';
          successMsg.style.display = 'block';
        } else {
          throw new Error(data.error || '提交失败');
        }
      })
      .catch(function(err){
        successMsg.style.color = '#b23b3b';
        successMsg.textContent = '提交失败：' + err.message + '，请稍后重试或直接联系新人';
        successMsg.style.display = 'block';
      })
      .finally(function(){
        submitBtn.disabled = false;
        submitBtn.textContent = '提 交 登 记';
      });
  });
</script>
</body>
</html>
