<style>
  :root{
    --card:#ffffff;
    --page:#f2ece1;
    --ink:#3a2e26;
    --ink-soft:#7a6a58;
    --red:#7a1f1f;
    --red-soft:#8f2a2a;
    --line:#dccfb6;
    --field:#fbf8f2;
    /* 与请柬图片里的字体保持一致：中文宋体、西文衬线体 */
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
    --serif-en:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page);
    font-family:var(--serif);
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .card{
    position:relative;
    width:100%;
    max-width:560px;
    background:var(--card);
    text-align:center;
    overflow:hidden;
  }
  @media (min-width:620px){
    body{padding:36px 16px;}
    .card{
      border-radius:3px;
      box-shadow:0 1px 2px rgba(58,46,38,.06), 0 18px 50px -16px rgba(58,46,38,.28);
    }
  }

  /* initial state lives in the keyframes, so a browser without CSS
     animation support still renders the content instead of hiding it */
  .reveal{animation:rise .9s cubic-bezier(.22,.7,.3,1) both;}
  .reveal.d1{animation-delay:.05s;}
  .reveal.d2{animation-delay:.28s;}
  .reveal.d3{animation-delay:.48s;}
  .reveal.d4{animation-delay:.66s;}
  @keyframes rise{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }

  .invitation-image{
    display:block;
    width:100%;
    height:auto;
    margin:0;
  }

  /* ---------- ornament divider ---------- */
  .ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:22px 24px;
  }
  .ornament i{
    display:block;
    height:1px;
    flex:1;
    max-width:96px;
    background:linear-gradient(to right,transparent,var(--line));
  }
  .ornament i:last-child{background:linear-gradient(to left,transparent,var(--line));}
  .ornament svg{width:36px;height:12px;fill:none;stroke:var(--red);stroke-width:1;}

  /* ---------- walking parade ---------- */
  .parade{
    position:relative;
    height:66px;
    margin:6px 0 0;
    overflow:hidden;
  }
  .parade .ground{
    position:absolute;
    left:24px;right:24px;bottom:9px;
    border-bottom:1px dashed var(--line);
  }
  .parade .sprite{
    position:absolute;
    bottom:6px;
    left:-96px;
    width:52px;
    animation:walk var(--dur) linear infinite;
    animation-delay:var(--delay);
    animation-fill-mode:backwards;
  }
  .parade .sprite.couple{width:84px;}
  .parade .sprite.kitten{width:40px;}
  .parade .sprite svg{
    display:block;
    width:100%;height:auto;
    fill:none;
    stroke:var(--red-soft);
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
    animation:bob .62s ease-in-out infinite alternate;
  }
  .parade .sprite.couple svg{stroke-width:1.5;}
  .parade .fw{fill:var(--card);}
  .parade .fk{fill:var(--red-soft);stroke:none;}
  @keyframes walk{
    from{left:-96px;}
    to{left:calc(100% + 96px);}
  }
  @keyframes bob{
    from{transform:translateY(0);}
    to{transform:translateY(-1.5px);}
  }
  .parade .leg{
    transform-box:fill-box;
    transform-origin:50% 0%;
    animation:step-a .62s ease-in-out infinite alternate;
  }
  .parade .leg.b{animation-name:step-b;}
  @keyframes step-a{from{transform:rotate(-14deg);}to{transform:rotate(14deg);}}
  @keyframes step-b{from{transform:rotate(14deg);}to{transform:rotate(-14deg);}}
  .parade .tail{
    transform-box:fill-box;
    transform-origin:100% 100%;
    animation:wag 1.5s ease-in-out infinite alternate;
  }
  @keyframes wag{from{transform:rotate(-7deg);}to{transform:rotate(7deg);}}
  .parade .skirt{
    transform-box:fill-box;
    transform-origin:50% 0%;
    animation:sway 1.24s ease-in-out infinite alternate;
  }
  @keyframes sway{from{transform:rotate(-1.6deg);}to{transform:rotate(1.6deg);}}

  @media (prefers-reduced-motion: reduce){
    .parade .sprite,.parade .leg,.parade .tail,.parade .skirt,.parade .sprite svg{animation:none;}
    .parade{display:none;}
    .reveal{animation:none;}
  }

  /* ---------- RSVP ---------- */
  .rsvp{
    padding:6px 24px 34px;
    text-align:left;
  }
  .rsvp-head{text-align:center;margin-bottom:22px;}
  .rsvp h2{
    font-family:var(--serif);
    font-size:20px;
    letter-spacing:6px;
    font-weight:700;
    margin:0 0 10px;
    color:var(--red);
    text-indent:6px;
  }
  .rsvp .deadline{
    font-size:12.5px;
    line-height:1.9;
    color:var(--ink-soft);
    margin:0;
  }
  .field{margin-bottom:15px;}
  .field label{
    display:block;
    font-size:12.5px;
    letter-spacing:1px;
    margin-bottom:7px;
    color:var(--ink-soft);
  }
  .field input,.field select,.field textarea{
    width:100%;
    padding:11px 12px;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    border:1px solid var(--line);
    background:var(--field);
    border-radius:3px;
    -webkit-appearance:none;
    appearance:none;
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;
    background:var(--card);
    border-color:var(--red-soft);
    box-shadow:0 0 0 3px rgba(143,42,42,.09);
  }
  .field select{
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' fill='none' stroke='%237a6a58' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:11px;
    padding-right:32px;
  }
  .field textarea{resize:vertical;min-height:62px;line-height:1.6;}
  .row2{display:flex;gap:12px;}
  .row2 .field{flex:1;}
  .submit-btn{
    display:block;
    width:100%;
    margin-top:10px;
    padding:14px;
    background:var(--red);
    color:#f7efe1;
    border:none;
    font-size:15px;
    letter-spacing:6px;
    text-indent:6px;
    font-family:var(--serif);
    font-weight:700;
    cursor:pointer;
    border-radius:3px;
    box-shadow:0 6px 16px -8px rgba(122,31,31,.7);
    transition:background .18s, transform .12s, box-shadow .18s;
  }
  .submit-btn:hover{background:var(--red-soft);}
  .submit-btn:active{transform:translateY(1px);box-shadow:0 3px 10px -7px rgba(122,31,31,.7);}
  .submit-btn:disabled{opacity:.6;cursor:default;}
  .rsvp-note{
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
    margin:14px 0 0;
    line-height:1.7;
  }
  .success-msg{
    display:none;
    text-align:center;
    color:var(--red);
    font-size:13.5px;
    margin:14px 0 0;
    padding:10px 12px;
    background:var(--field);
    border:1px solid var(--line);
    border-radius:3px;
  }

  /* ---------- footer ---------- */
  .footer{
    padding:24px 24px 34px;
    border-top:1px solid rgba(220,207,182,.6);
    text-align:center;
  }
  .footer .names{
    font-family:var(--serif);
    font-size:16px;
    font-weight:700;
    letter-spacing:4px;
    color:var(--red);
    margin:0 0 6px;
  }
  .footer .date{
    font-family:var(--serif-en);
    font-style:italic;
    font-size:12.5px;
    letter-spacing:2px;
    color:var(--ink-soft);
    margin:0;
  }
</style>
</head>

<script>
  // 表单接口所在地址。
  //
  // 本页面托管在 GitHub Pages 上，而 GitHub Pages 只能放静态文件、跑不了后端函数，

  //
  // 如果哪天整站都搬到 EdgeOne 上，把这里改成空字符串 '' 就会走同源请求。
  var API_BASE = 'https://weddinginvitation-dpcecgtcs5rh.edgeone.cool/';

  // 同源模式下，按页面所在目录解析，兼容站点根目录与 /Wedding-Invitation/ 子路径
  function apiUrl(p){
    return (API_BASE || location.pathname.replace(/[^/]*$/, '')) + p;
  }

  var form = document.getElementById('rsvpForm');
  var submitBtn = document.getElementById('submitBtn');
  var successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var payload = {
      name: document.getElementById('name').value.trim(),
      attend: document.getElementById('attend').value,
      count: document.getElementById('count').value,
      city: document.getElementById('city').value.trim(),
      note: document.getElementById('note').value.trim()
    };

    submitBtn.disabled = true;
    submitBtn.textContent = '提交中…';
    successMsg.style.color = '';
    successMsg.style.display = 'none';

    fetch(apiUrl('api/rsvp'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data.ok) {
          successMsg.textContent = data.mode === 'updated'
            ? '已更新您的登记信息，感谢回复！'
            : '登记成功，感谢回复！';
          successMsg.style.display = 'block';
        } else {
          throw new Error(data.error || '提交失败');
        }
      })
      .catch(function(err){
        successMsg.style.color = '#b23b3b';
        successMsg.textContent = '提交失败：' + err.message + '，请稍后重试或直接联系新人';
        successMsg.style.display = 'block';
      })
      .finally(function(){
        submitBtn.disabled = false;
        submitBtn.textContent = '提交登记';
      });
  });
</script>
</body>
</html>
