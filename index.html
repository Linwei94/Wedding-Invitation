<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>陶林伟 & 肖佩韦 · 婚礼请柬</title>
<meta name="description" content="2026年10月17日 · 上海松江广富林希尔顿酒店，诚邀您的光临">
<meta property="og:title" content="陶林伟 & 肖佩韦 · 婚礼请柬">
<meta property="og:description" content="2026年10月17日 · 上海松江广富林希尔顿酒店，诚邀您的光临">
<meta property="og:type" content="website">
<!-- 微信/多数抓取程序只认绝对地址，换域名后这几行要一起改 -->
<meta property="og:url" content="https://www.taolinwei.com/Wedding-Invitation/">
<meta property="og:image" content="https://www.taolinwei.com/Wedding-Invitation/images/share.jpg?v=2">
<meta property="og:image:width" content="400">
<meta property="og:image:height" content="400">
<meta itemprop="image" content="https://www.taolinwei.com/Wedding-Invitation/images/share.jpg?v=2">
<link rel="image_src" href="https://www.taolinwei.com/Wedding-Invitation/images/share.jpg?v=2">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://www.taolinwei.com/Wedding-Invitation/images/share.jpg?v=2">
<link rel="icon" href="favicon.ico?v=3" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="images/icons/icon-32.png?v=3" sizes="32x32">
<link rel="icon" type="image/png" href="images/icons/icon-192.png?v=3" sizes="192x192">
<link rel="apple-touch-icon" href="images/icons/icon-180.png?v=3">
<link rel="manifest" href="site.webmanifest?v=3">
<meta name="theme-color" content="#7a1f1f">
<meta name="apple-mobile-web-app-title" content="婚礼请柬">
<style>
  :root{
    --card:#ffffff;
    --page:#f2ece1;
    --ink:#3a2e26;
    --ink-soft:#7a6a58;
    --red:#7a1f1f;
    --red-soft:#8f2a2a;
    --line:#dccfb6;
    --field:#fbf8f2;
    /* 与请柬图片里的字体保持一致：中文宋体、西文衬线体 */
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
    --serif-en:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;}
  /* hidden 属性必须真的能隐藏元素。浏览器自带的 [hidden]{display:none} 属于 UA 样式，
     优先级低于任何作者样式，所以下面 .fb-btn / .fb-qr 上的 display:block 会把它顶掉，
     元素照样显示出来（这个坑本文件早先在 .lightbox[hidden] 上已经踩过一次）。
     加一条 !important 的兜底，JS 里 el.hidden = false 会移除属性，规则自然失效。 */
  [hidden]{display:none !important;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page);
    font-family:var(--serif);
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .card{
    position:relative;
    width:100%;
    max-width:560px;
    background:var(--card);
    text-align:center;
    overflow:hidden;
  }
  @media (min-width:620px){
    body{padding:36px 16px;}
    .card{
      border-radius:3px;
      box-shadow:0 1px 2px rgba(58,46,38,.06), 0 18px 50px -16px rgba(58,46,38,.28);
    }
  }

  /* initial state lives in the keyframes, so a browser without CSS
     animation support still renders the content instead of hiding it */
  .reveal{animation:rise .9s cubic-bezier(.22,.7,.3,1) both;}
  .reveal.d1{animation-delay:.05s;}
  .reveal.d2{animation-delay:.28s;}
  .reveal.d3{animation-delay:.48s;}
  .reveal.d4{animation-delay:.66s;}
  @keyframes rise{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }

  .invitation-image{
    display:block;
    width:100%;
    height:auto;
    margin:0;
  }


  .invitation-zoom{
    display:block;
    position:relative;
    width:100%;
    padding:0;margin:0;border:none;
    background:none;
    cursor:zoom-in;
    -webkit-tap-highlight-color:transparent;
  }
  /* ---------- ornament divider ---------- */
  .ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:22px 24px;
  }
  .ornament i{
    display:block;
    height:1px;
    flex:1;
    max-width:96px;
    background:linear-gradient(to right,transparent,var(--line));
  }
  .ornament i:last-child{background:linear-gradient(to left,transparent,var(--line));}
  .ornament svg{width:36px;height:12px;fill:none;stroke:var(--red);stroke-width:1;}


  /* ---------- venue / map ---------- */
  .venue{padding:26px 24px 6px;text-align:center;}
  .venue h2{
    font-family:var(--serif);
    font-size:19px;letter-spacing:6px;font-weight:700;
    margin:0 0 14px;color:var(--red);text-indent:6px;
  }
  .venue-card{
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--field);
    overflow:hidden;
  }
  .venue-art{
    display:block;width:100%;height:112px;
    background:#f6f1e6;
    border-bottom:1px solid var(--line);
  }
  .venue-art svg{width:100%;height:100%;display:block;}
  .venue-body{padding:16px 16px 18px;}
  .venue-name{font-size:15px;font-weight:700;margin:0 0 5px;line-height:1.5;}
  .venue-addr{font-size:13px;color:var(--ink-soft);margin:0 0 4px;line-height:1.7;}
  .venue-time{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;}
  .copy-addr{
    display:block;width:100%;margin-top:8px;
    padding:11px 8px;font-size:13.5px;font-family:inherit;
    color:var(--ink-soft);background:var(--card);
    border:1px solid var(--line);border-radius:3px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .copy-addr.done{color:var(--red);border-color:var(--red-soft);}

  /* ---------- walking parade ---------- */
  .parade{
    position:relative;
    height:66px;
    margin:6px 0 0;
    overflow:hidden;
  }
  .parade .ground{
    position:absolute;
    left:24px;right:24px;bottom:9px;
    border-bottom:1px dashed var(--line);
  }
  .parade .sprite{
    position:absolute;
    bottom:6px;
    left:-96px;
    width:52px;
    animation:walk var(--dur) linear infinite;
    animation-delay:var(--delay);
    animation-fill-mode:backwards;
  }
  .parade .sprite.couple{width:84px;}
  .parade .sprite.kitten{width:40px;}
  .parade .sprite svg{
    display:block;
    width:100%;height:auto;
    fill:none;
    stroke:var(--red-soft);
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
    animation:bob .62s ease-in-out infinite alternate;
  }
  .parade .sprite.couple svg{stroke-width:1.5;}
  .parade .fw{fill:var(--card);}
  .parade .fk{fill:var(--red-soft);stroke:none;}
  @keyframes walk{
    from{left:-96px;}
    to{left:calc(100% + 96px);}
  }
  @keyframes bob{
    from{transform:translateY(0);}
    to{transform:translateY(-1.5px);}
  }
  .parade .leg{
    transform-box:fill-box;
    transform-origin:50% 0%;
    animation:step-a .62s ease-in-out infinite alternate;
  }
  .parade .leg.b{animation-name:step-b;}
  @keyframes step-a{from{transform:rotate(-14deg);}to{transform:rotate(14deg);}}
  @keyframes step-b{from{transform:rotate(14deg);}to{transform:rotate(-14deg);}}
  .parade .tail{
    transform-box:fill-box;
    transform-origin:100% 100%;
    animation:wag 1.5s ease-in-out infinite alternate;
  }
  @keyframes wag{from{transform:rotate(-7deg);}to{transform:rotate(7deg);}}
  .parade .skirt{
    transform-box:fill-box;
    transform-origin:50% 0%;
    animation:sway 1.24s ease-in-out infinite alternate;
  }
  @keyframes sway{from{transform:rotate(-1.6deg);}to{transform:rotate(1.6deg);}}

  @media (prefers-reduced-motion: reduce){
    .parade .sprite,.parade .leg,.parade .tail,.parade .skirt,.parade .sprite svg{animation:none;}
    .parade{display:none;}
    .reveal{animation:none;}
  }

  /* ---------- RSVP ---------- */
  .rsvp{
    padding:6px 24px 34px;
    text-align:left;
  }
  .rsvp-head{text-align:center;margin-bottom:20px;}
  .rsvp h2{
    font-family:var(--serif);
    font-size:20px;
    letter-spacing:6px;
    font-weight:700;
    margin:0;
    color:var(--red);
    text-indent:6px;
  }
  .field{margin-bottom:15px;}
  .field label{
    display:block;
    font-size:12.5px;
    letter-spacing:1px;
    margin-bottom:7px;
    color:var(--ink-soft);
  }
  .field input,.field select,.field textarea{
    width:100%;
    padding:11px 12px;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    border:1px solid var(--line);
    background:var(--field);
    border-radius:3px;
    -webkit-appearance:none;
    appearance:none;
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;
    background:var(--card);
    border-color:var(--red-soft);
    box-shadow:0 0 0 3px rgba(143,42,42,.09);
  }
  .field select{
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' fill='none' stroke='%237a6a58' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:11px;
    padding-right:32px;
  }
  .field textarea{resize:vertical;min-height:62px;line-height:1.6;}
  .row2{display:flex;gap:12px;}
  .row2 .field{flex:1;}
  .submit-btn{
    display:block;
    width:100%;
    margin-top:10px;
    padding:14px;
    background:var(--red);
    color:#f7efe1;
    border:none;
    font-size:15px;
    letter-spacing:6px;
    text-indent:6px;
    font-family:var(--serif);
    font-weight:700;
    cursor:pointer;
    border-radius:3px;
    box-shadow:0 6px 16px -8px rgba(122,31,31,.7);
    transition:background .18s, transform .12s, box-shadow .18s;
  }
  .submit-btn:hover{background:var(--red-soft);}
  .submit-btn:active{transform:translateY(1px);box-shadow:0 3px 10px -7px rgba(122,31,31,.7);}
  .submit-btn:disabled{opacity:.6;cursor:default;}
  .rsvp-note{
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
    margin:14px 0 0;
    line-height:1.7;
  }
  .success-msg{
    display:none;
    text-align:center;
    color:var(--red);
    font-size:13.5px;
    margin:14px 0 0;
    padding:10px 12px;
    background:var(--field);
    border:1px solid var(--line);
    border-radius:3px;
  }

  /* 蜜罐输入框：真人看不见也 tab 不到，脚本会填。移到屏幕外而不是 display:none，
     因为有些脚本会跳过不可见的字段。 */
  .hp-field{position:absolute;left:-99999px;width:1px;height:1px;overflow:hidden;}

  /* ---------- 备用登记通道（主接口连不上时自动出现） ---------- */
  .rsvp-fallback{
    margin-top:16px;
    padding:16px 14px 14px;
    background:var(--field);
    border:1px solid var(--line);
    border-radius:3px;
  }
  .fb-title{
    font-size:13.5px;
    font-weight:700;
    color:var(--red);
    text-align:center;
    letter-spacing:2px;
    margin:0 0 8px;
  }
  .fb-lead{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.8;
    margin:0 0 14px;
  }
  .fb-btn{
    display:block;
    width:100%;
    padding:12px;
    background:var(--red);
    color:#f7efe1;
    border:none;
    border-radius:3px;
    font-family:var(--serif);
    font-size:14px;
    font-weight:700;
    letter-spacing:3px;
    text-indent:3px;
    text-align:center;
    text-decoration:none;
    cursor:pointer;
  }
  .fb-btn.ghost{background:transparent;color:var(--red);border:1px solid var(--red-soft);}
  .fb-or{text-align:center;font-size:11.5px;color:var(--ink-soft);margin:10px 0;}
  .fb-box{
    display:none;
    margin-top:10px;
    padding:10px 12px;
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:3px;
    font-size:12.5px;
    line-height:1.8;
    word-break:break-all;
    /* 复制被浏览器拒绝时，宾客还能长按选中这段文字 */
    -webkit-user-select:all;
    user-select:all;
  }
  .fb-hint{
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.8;
    margin:12px 0 0;
  }
  .fb-qr{
    display:block;
    width:132px;
    margin:10px auto 0;
    padding:5px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:3px;
  }

  /* ---------- gallery ---------- */
  .gallery{padding:2px 0 8px;}
  .gsec{margin-bottom:36px;}
  .gsec:last-child{margin-bottom:6px;}
  .glabel{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:0 24px 14px;
  }
  .glabel i{
    display:block;height:1px;flex:1;max-width:70px;
    background:linear-gradient(to right,transparent,var(--line));
  }
  .glabel i:last-child{background:linear-gradient(to left,transparent,var(--line));}
  .glabel span{
    font-size:14px;
    letter-spacing:3px;
    font-weight:700;
    color:var(--red);
    white-space:nowrap;
  }
  .glabel em{
    display:block;
    font-family:var(--serif-en);
    font-style:italic;
    font-size:10.5px;
    letter-spacing:2px;
    font-weight:400;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    padding:0 5px;
  }
  .tile{
    position:relative;
    display:block;
    padding:0;
    margin:0;
    border:none;
    background:var(--field);
    overflow:hidden;
    cursor:zoom-in;
    -webkit-tap-highlight-color:transparent;
  }
  .tile.full{grid-column:1 / -1;}
  .tile.r32{aspect-ratio:3 / 2;}
  .tile.r23{aspect-ratio:2 / 3;}
  .tile.r11{aspect-ratio:1 / 1;}
  .tile img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s cubic-bezier(.22,.7,.3,1);
  }
  /* 未加载完的图占位为浅色，加载完淡入 */
  .tile img{opacity:0;transition:opacity .35s ease;}
  .tile img.loaded{opacity:1;}
  /* keep faces in frame when a portrait shot is cropped square */
  .tile.r11 img{object-position:center 32%;}
  @media (hover:hover){
    .tile:hover img{transform:scale(1.035);}
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:50;
    background:rgba(30,24,19,.94);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:fade .22s ease both;
  }
  .lightbox[hidden]{display:none;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .lightbox img{
    max-width:94vw;
    max-height:86vh;
    object-fit:contain;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .lb-close,.lb-nav{
    position:absolute;
    background:none;
    border:none;
    color:#f2ece1;
    cursor:pointer;
    line-height:1;
    padding:12px 16px;
    opacity:.75;
    transition:opacity .16s;
    -webkit-tap-highlight-color:transparent;
  }
  .lb-close:hover,.lb-nav:hover{opacity:1;}
  .lb-close{top:6px;right:8px;font-size:34px;}
  .lb-nav{top:50%;transform:translateY(-50%);font-size:44px;}
  .lb-prev{left:2px;}
  .lb-next{right:2px;}


  /* ---------- background music ---------- */
  .bgm-toggle{
    position:fixed;
    right:14px;
    top:calc(14px + env(safe-area-inset-top,0px));
    z-index:40;
    width:38px;height:38px;
    display:none;                 /* 找不到音频文件时保持隐藏 */
    align-items:center;
    justify-content:center;
    padding:0;
    border:1px solid var(--line);
    border-radius:50%;
    background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    box-shadow:0 2px 10px rgba(58,46,38,.16);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .bgm-toggle.ready{display:flex;}
  .bgm-toggle svg{width:18px;height:18px;fill:none;stroke:var(--red);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .bgm-toggle.playing svg{animation:spin 4s linear infinite;}
  .bgm-toggle.paused{opacity:.55;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){
    .bgm-toggle.playing svg{animation:none;}
  }
  /* ---------- footer ---------- */
  .footer{
    padding:24px 24px 34px;
    border-top:1px solid rgba(220,207,182,.6);
    text-align:center;
  }
  .footer .names{
    font-family:var(--serif);
    font-size:16px;
    font-weight:700;
    letter-spacing:4px;
    color:var(--red);
    margin:0 0 6px;
  }
  .footer .date{
    font-family:var(--serif-en);
    font-style:italic;
    font-size:12.5px;
    letter-spacing:2px;
    color:var(--ink-soft);
    margin:0;
  }
</style>
</head>
<body>
  <!-- 微信抓取缩略图时常取 HTML 里的第一张图，这里放一张方形的备用图 -->
  <img src="images/share.jpg?v=2" alt="陶林伟 & 肖佩韦" width="400" height="400"
       loading="lazy" style="position:absolute;left:-99999px;top:0;">

  <div class="card">
    <button type="button" class="invitation-zoom reveal d1">
      <img class="invitation-image" src="images/invitation.jpg?v=2" width="1111" height="1700" fetchpriority="high" decoding="async" alt="陶林伟 & 肖佩韦 婚礼请柬，2026.10.17 星期六，松江广富林希尔顿酒店会议中心一楼大宴会厅">
    </button>

    <div class="venue reveal d2">
      <h2>婚礼地址</h2>
      <div class="venue-card">
        <div class="venue-art" aria-hidden="true">
          <svg viewBox="0 0 320 112" preserveAspectRatio="xMidYMid slice">
            <rect width="320" height="112" fill="#f6f1e6"/>
            <g stroke="#dccfb6" stroke-width="1" fill="none">
              <path d="M0,26 H320 M0,58 H320 M0,90 H320"/>
              <path d="M46,0 V112 M112,0 V112 M208,0 V112 M268,0 V112"/>
            </g>
            <path d="M112,58 H208 V90" stroke="#c9b998" stroke-width="3" fill="none"/>
            <g transform="translate(160,44)">
              <path d="M0,18 C-9,6 -13,0 -13,-6 A13,13 0 1 1 13,-6 C13,0 9,6 0,18 Z"
                    fill="#7a1f1f"/>
              <circle cx="0" cy="-6" r="4.6" fill="#f6f1e6"/>
            </g>
          </svg>
        </div>
        <div class="venue-body">
          <p class="venue-name">松江广富林希尔顿酒店会议中心 · 一楼大宴会厅</p>
          <p class="venue-addr">上海市松江区广轩路 1199 号</p>
          <p class="venue-time">2026 年 10 月 17 日（周六）17:08 签到 · 18:08 晚宴</p>
          <button type="button" class="copy-addr" id="copyAddr">复制地址</button>
        </div>
      </div>
    </div>

    <div class="ornament reveal d2" aria-hidden="true">
      <i></i>
      <svg viewBox="0 0 36 12"><path d="M18,2 L22,6 L18,10 L14,6 Z"/><path d="M6,6 h5 M25,6 h5"/></svg>
      <i></i>
    </div>

    <div class="rsvp reveal d2">
      <div class="rsvp-head">
        <h2>出席登记</h2>
      </div>
      <form id="rsvpForm">
        <div class="row2">
          <div class="field" style="flex:1.6;">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="field">
            <label for="count">出席人数</label>
            <select id="count" name="count">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
        </div>
        <div class="hp-field" aria-hidden="true">
          <label for="website_url">网址</label>

<script>
  // ================= 登记接口配置（改这三行就够） =================
  //
  // RSVP_ENDPOINT  登记接口地址，结尾不要带斜杠，例：'https://rsvp.taolinwei.com'
  //                留空 = 不去连任何服务器，宾客点提交后直接看到「备用登记通道」。
  //                这个默认值是刻意的：宁可让宾客走备用通道，也不要对着一个
  //                不存在的接口白转圈，最后什么都没登记上。
  // FALLBACK_FORM_URL  国内备用表单（金数据等）的地址，留空则不显示这一层。
  // CONTACT_LINE   备用通道里显示的联系方式文字，留空则不显示。
  //                另外把新人微信二维码放成 images/wechat-qr.png 就会自动显示。
  var RSVP_ENDPOINT     = '';
  var FALLBACK_FORM_URL = '';
  var CONTACT_LINE      = '';
  // ==============================================================

  // 容错：地址结尾带了斜杠也没关系。不处理的话会拼出 //api/rsvp 这种路径，
  // 服务端匹配不上，直接 404——而且是那种"看着填对了却死活不通"的错。
  RSVP_ENDPOINT = String(RSVP_ENDPOINT).replace(/\/+$/, '');

  var form = document.getElementById('rsvpForm');
  var submitBtn = document.getElementById('submitBtn');
  var successMsg = document.getElementById('successMsg');
  var fallbackBox = document.getElementById('rsvpFallback');

  // 页面一打开就先打一发 /health，把 DNS + TCP + TLS 这几个往返在宾客读请柬的时候
  // 提前付掉。等真正点提交时就只剩一个往返——国际链路上这能省掉一秒多的「转圈」，
  // 而「按钮一直转、宾客以为失败、连点好几次」正是最常见的抱怨。
  if (RSVP_ENDPOINT) {
    try {
      var warm = new XMLHttpRequest();
      warm.open('GET', RSVP_ENDPOINT + '/health', true);
      warm.timeout = 8000;
      warm.send();
    } catch (e) {}
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();

    var payload = {
      name: document.getElementById('name').value.trim(),
      count: document.getElementById('count').value,
      website_url: document.getElementById('website_url').value
    };
    // 只填空格也算没填。<input required> 挡不住空格，而这里如果直接 return，
    // 宾客会看到点了提交完全没反应——没提示、没转圈、什么都没有。
    if (!payload.name) {
      showError('请填写姓名');
      try { document.getElementById('name').focus(); } catch (e) {}
      return;
    }

    setBusy(true);
    successMsg.style.display = 'none';

    // 两次尝试：10 秒，再 8 秒。整体最多约 18 秒后转备用通道。
    send(payload, 10000, function(r1){
      if (r1.ok) return succeed(r1.data);
      if (r1.userError) return showError(r1.userError);
      send(payload, 8000, function(r2){
        if (r2.ok) return succeed(r2.data);
        if (r2.userError) return showError(r2.userError);
        giveUp(payload);
      });
    });
  });

  // 用 XMLHttpRequest 而不是 fetch，是因为微信内置浏览器（X5 内核）老版本里没有
  // Promise.prototype.finally——原来那段 .finally() 在这些手机上会直接抛异常，
  // 把按钮永久卡在「提交中…」，宾客再也没法重试。XHR 自带 timeout，也顺便
  // 省掉了 AbortController 的兼容判断。
  function send(payload, timeout, cb){
    var settled = false;
    function finish(r){ if (!settled) { settled = true; cb(r); } }

    if (!RSVP_ENDPOINT) return finish({ ok: false });

    var xhr;
    try { xhr = new XMLHttpRequest(); } catch (e) { return finish({ ok: false }); }

    try {
      xhr.open('POST', RSVP_ENDPOINT + '/api/rsvp', true);
      // text/plain 属于 CORS 的「简单请求」，不会触发 OPTIONS 预检，省一个往返。
      // 服务端相应地用 JSON.parse(await request.text()) 自己解析。
      xhr.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
      xhr.timeout = timeout;
      xhr.onload = function(){
        var data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status >= 200 && xhr.status < 300 && data && data.ok === true) {
          return finish({ ok: true, data: data });
        }
        // 400 是「宾客填的内容有问题」、429 是「提交太频繁」，服务端返回的都是
        // 我们自己写的中文提示，直接展示就好；这两种情况重试和转备用通道都没有意义。
        if ((xhr.status === 400 || xhr.status === 429) && data && data.error) {
          return finish({ ok: false, userError: data.error });
        }
        finish({ ok: false });
      };
      xhr.onerror = function(){ finish({ ok: false }); };
      xhr.ontimeout = function(){ finish({ ok: false }); };
      xhr.onabort = function(){ finish({ ok: false }); };
      xhr.send(JSON.stringify(payload));
    } catch (e) {
      finish({ ok: false });
    }
  }

  function succeed(data){
    setBusy(false);
    fallbackBox.hidden = true;
    successMsg.style.color = '';
    successMsg.textContent = data && data.mode === 'updated'
      ? '已更新您的登记信息，感谢回复！'
      : '登记成功，感谢回复！';
    successMsg.style.display = 'block';
  }

  function showError(text){
    setBusy(false);
    successMsg.style.color = '#b23b3b';
    successMsg.textContent = text;
    successMsg.style.display = 'block';
  }

  function giveUp(payload){
    setBusy(false);
    successMsg.style.color = '#b23b3b';
    // 固定文案，绝不把 err.message 拼进来——原来那版会让长辈看到
    // 「提交失败：Failed to fetch」，既看不懂也不知道该怎么办。
    successMsg.textContent = '网络不太稳定，登记没有提交成功。请用下面任意一种方式登记。';
    successMsg.style.display = 'block';
    openFallback(payload);
  }

  // 按钮状态集中在一处，保证任何一条失败路径都会把它放开。
  function setBusy(busy){
    submitBtn.disabled = busy;
    submitBtn.textContent = busy ? '提交中…' : '提交登记';
  }

  function openFallback(payload){
    document.getElementById('fbText').textContent = composeLine(payload);

    if (FALLBACK_FORM_URL) {
      // 预填姓名和人数，宾客到那边直接提交就行，不用重新打一遍。
      var link = document.getElementById('fbFormLink');
      link.href = FALLBACK_FORM_URL
        + (FALLBACK_FORM_URL.indexOf('?') >= 0 ? '&' : '?')
        + 'name=' + encodeURIComponent(payload.name)
        + '&count=' + encodeURIComponent(payload.count);
      link.hidden = false;
      document.getElementById('fbOr').hidden = false;
    }

    if (CONTACT_LINE) {
      var contact = document.getElementById('fbContact');
      contact.textContent = CONTACT_LINE;
      contact.hidden = false;
    }

    // 二维码放了才显示，没放就不显示——免得出现一个破图。
    var qr = document.getElementById('fbQr');
    var probe = new Image();
    probe.onload = function(){ qr.hidden = false; };
    probe.src = qr.getAttribute('src');

    fallbackBox.hidden = false;
    if (fallbackBox.scrollIntoView) {
      try { fallbackBox.scrollIntoView(); } catch (e) {}
    }
  }

  // 拼成一行，方便宾客整条转发给新人。
  // ｜和【】是这行字的分隔符，姓名里出现就换成空格，免得那边读串行。
  function composeLine(payload){
    return '【出席登记】姓名：' + clean(payload.name, 40)
      + '｜人数：' + clean(payload.count, 2);
  }
  function clean(s, max){
    return String(s == null ? '' : s).replace(/[｜|【】\r\n]/g, ' ').trim().slice(0, max);
  }

  document.getElementById('fbCopyBtn').addEventListener('click', function(){
    var btn = this;
    var box = document.getElementById('fbText');
    box.style.display = 'block';    // 复制被拒时，至少能长按选中这段字
    copyToClipboard(box.textContent, function(ok){
      btn.textContent = ok ? '已复制，粘贴发给新人即可' : '请长按下面的文字复制';
      setTimeout(function(){ btn.textContent = '复制登记信息，发给新人'; }, 2600);
    });
  });

  // 复制到剪贴板，回调收到 true / false。
  // 注意 document.execCommand('copy') 失败时是**返回 false**，不是抛异常——
  // 只用 try/catch 判断会在复制失败时照样告诉宾客「已复制」，而剪贴板是空的。
  function copyToClipboard(text, cb){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function(){ cb(true); },
        function(){ cb(legacyCopy(text)); }
      );
    } else {
      cb(legacyCopy(text));
    }
  }

  function legacyCopy(text){
    var ok = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      if (ta.setSelectionRange) ta.setSelectionRange(0, ta.value.length);  // iOS 要显式设选区
      ok = document.execCommand('copy') === true;
      document.body.removeChild(ta);
    } catch (e) {
      ok = false;
    }
    return ok;
  }

  // ---- gallery lightbox ----
  (function(){
    var tiles = [].slice.call(document.querySelectorAll('.invitation-zoom, .tile'));
    if (!tiles.length) return;
    var box = document.getElementById('lightbox');
    var img = document.getElementById('lbImg');
    var at = 0;

    function show(i){
      at = (i + tiles.length) % tiles.length;
      var src = tiles[at].querySelector('img');
      img.src = src.currentSrc || src.getAttribute('src') || src.getAttribute('data-src');
      img.alt = src.alt;
    }
    function open(i){
      show(i);
      box.hidden = false;
      document.body.style.overflow = 'hidden';
    }
    function close(){
      box.hidden = true;
      img.src = '';
      document.body.style.overflow = '';
    }

    tiles.forEach(function(t, i){
      t.addEventListener('click', function(){ open(i); });
    });
    document.getElementById('lbClose').addEventListener('click', close);
    document.getElementById('lbPrev').addEventListener('click', function(e){
      e.stopPropagation(); show(at - 1);
    });
    document.getElementById('lbNext').addEventListener('click', function(e){
      e.stopPropagation(); show(at + 1);
    });
    // tapping the backdrop closes; tapping the photo itself does not
    box.addEventListener('click', function(e){ if (e.target === box || e.target === img) close(); });
    document.addEventListener('keydown', function(e){
      if (box.hidden) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(at - 1);
      else if (e.key === 'ArrowRight') show(at + 1);
    });
  })();

  // ---- background music ----
  (function(){
    var audio = document.getElementById('bgm');
    var btn = document.getElementById('bgmBtn');
    var TARGET = 0.45;
    var started = false;     // 真正出声过
    var userPaused = false;  // 用户主动按了暂停，就别再自动接管

    // iOS 在用户交互前不会缓冲音频，canplay 可能一直不触发，
    // 所以按钮默认就显示，只有确认文件加载失败时才隐藏。
    btn.classList.add('ready');
    audio.addEventListener('error', function(){ btn.classList.remove('ready'); });

    function sync(){
      btn.classList.toggle('playing', !audio.paused);
      btn.classList.toggle('paused', audio.paused);
    }
    audio.addEventListener('play', sync);
    audio.addEventListener('pause', sync);
    audio.addEventListener('playing', function(){
      started = true;
      sync();
      document.removeEventListener('pointerdown', onGesture);
      document.removeEventListener('touchstart', onGesture);
    });

    function attempt(){
      if (userPaused) return;
      audio.volume = TARGET;   // 曲子起音本就很轻，不需要额外渐强
      var p = audio.play();
      if (p && p.catch) p.catch(function(){ /* 被拦下，等下一次交互 */ });
    }

    // 允许自动播放的浏览器：缓冲到能一口气播完就开始
    audio.addEventListener('canplaythrough', attempt, { once: true });

    // 页面主要内容加载完之后才下载音频，不和请柬图抢带宽
    function fetchAudio(){ audio.preload = 'auto'; audio.load(); }
    if (document.readyState === 'complete') fetchAudio();
    else window.addEventListener('load', fetchAudio);

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      if (audio.paused) { userPaused = false; attempt(); }
      else { userPaused = true; audio.pause(); }
    });

    // iOS Safari / 微信 iOS 一定会拦截自动播放，只能靠用户交互触发。
    // 这里保持监听直到真的播出声为止 —— 第一次轻触时音频可能还没就绪。
    function onGesture(){ if (!started) attempt(); }
    document.addEventListener('pointerdown', onGesture);
    document.addEventListener('touchstart', onGesture);

    // 微信安卓版允许在 JSBridge 就绪后自动播放
    document.addEventListener('WeixinJSBridgeReady', attempt, false);
    sync();
  })();

  // ---- 相册图片：一张一张按从上到下的顺序加载 ----
  // 浏览器原生 loading="lazy" 会一次并发抓好几张，这里改为自己排队，
  // 同一时刻只下载一张，且始终挑文档顺序最靠前的那张。
  (function(){
    var imgs = [].slice.call(document.querySelectorAll('.grid img[data-src]'));
    if (!imgs.length) return;

    // 不支持 IntersectionObserver 的老浏览器：直接全部加载，别让相册空着
    if (!('IntersectionObserver' in window)) {
      imgs.forEach(function(img){
        img.src = img.getAttribute('data-src');
        img.classList.add('loaded');
      });
      return;
    }

    var busy = false;

    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) { e.target.__wanted = true; io.unobserve(e.target); }
      });
      pump();
    }, { rootMargin: '800px 0px' });   // 提前一屏多开始排队，滚动时不至于等太久

    imgs.forEach(function(img){ io.observe(img); });

    function pump(){
      if (busy) return;
      var next = null;
      for (var i = 0; i < imgs.length; i++) {
        var im = imgs[i];
        if (im.__wanted && !im.__done) { next = im; break; }
      }
      if (!next) return;
      busy = true;
      load(next, function(){ busy = false; pump(); });
    }

    function load(img, done){
      var src = img.getAttribute('data-src');
      var tries = 0;
      img.onload = function(){
        img.onload = img.onerror = null;
        img.classList.add('loaded');
        img.__done = true;
        done();
      };
      img.onerror = function(){
        // 加载失败的图不会自动重来，必须自己退避重试，否则永远是破图
        if (tries < 3) {
          tries++;
          setTimeout(function(){
            img.src = src + (src.indexOf('?') > -1 ? '&' : '?') + 'retry=' + tries;
          }, 500 * tries);
        } else {
          img.onload = img.onerror = null;
          img.__done = true;   // 放弃这张，继续下一张，不要卡住整个队列
          done();
        }
      };
      img.src = src;
    }
  })();

  // ---- 婚礼地址：复制地址 ----
  (function(){
    var NAME = '松江广富林希尔顿酒店会议中心';
    var ADDR = '上海市松江区广轩路1199号';

    var btn = document.getElementById('copyAddr');
    btn.addEventListener('click', function(){
      var text = NAME + '\n' + ADDR;
      // 复用登记那边的 copyToClipboard，它会真的检查 execCommand 的返回值，
      // 不会在复制失败时谎报「已复制」。
      copyToClipboard(text, function(ok){
        btn.textContent = ok ? '地址已复制' : '复制失败，请长按选中';
        btn.classList.add('done');
        setTimeout(function(){
          btn.textContent = '复制地址';
          btn.classList.remove('done');
        }, 2000);
      });
    });
  })();
</script>
