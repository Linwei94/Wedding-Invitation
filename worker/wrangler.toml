name = "wedding-rsvp"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 第一步：先用 Cloudflare 送的 *.workers.dev 地址跑通，不用改任何 DNS。
# 部署完 wrangler 会打印出形如
#   https://wedding-rsvp.<你的子域>.workers.dev
# 把它填进 index.html 和 admin.html 的 RSVP_ENDPOINT，登记就能用了。
workers_dev = true

# 第二步（为了国内访问，等域名迁到 Cloudflare 之后再打开）：
# *.workers.dev 在国内有大量被 DNS 污染的报告，所以国内要靠自己的域名。
# 但 custom_domain 要求这个域名的 DNS 托管在 Cloudflare——taolinwei.com 现在的
# NS 是 GoDaddy（ns67/ns68.domaincontrol.com），所以必须先把 NS 换成 Cloudflare 的，
# 那一步会连 www 指向 GitHub Pages 的记录一起接管，动之前先确认。迁好之后再取消注释：
# routes = [
#   { pattern = "rsvp.taolinwei.com", custom_domain = true }
# ]

# 建库时务必指定 APAC，否则库可能落在美东，每次写入要多跨一次太平洋：
#   wrangler d1 create rsvp --location apac
# 建完把下面的 database_id 换成命令输出里的那个 UUID。
[[d1_databases]]
binding = "DB"
database_name = "rsvp"
database_id = "在这里填 wrangler d1 create 输出的 database_id"

[vars]
# 允许调用接口的页面来源，英文逗号分隔。唯一的调用方是后台 admin.html，
# 它跟请柬页同域，所以填请柬页的域名即可（来源只算协议+域名，不含路径）。
# github.io 那个一起留着，方便你在换域名前后都能打开后台。
ALLOWED_ORIGIN = "https://www.taolinwei.com,https://linwei94.github.io"

# 备份用的私有仓库（见 src/backup.js）。不用备份就把 cron 那段删掉。
BACKUP_REPO = ""
BACKUP_PATH = "guests"
HEALTHCHECK_URL = ""

# 每天备份一次；婚礼前两周建议改成 "0 */12 * * *"
[triggers]
crons = ["17 19 * * *"]

# 以下用 `wrangler secret put <名字>` 设置，不要写进这个文件：
#   ADMIN_TOKEN     后台口令，也是三个接口唯一的鉴权凭据。32 位以上随机串，
#                   不要用自己平时的密码——它是保护全部宾客姓名的唯一一道门。
#   BACKUP_TOKEN    只对那个私有备份仓库有 Contents:R/W 权限的 fine-grained PAT（不备份可不设）
