# nginx 反向代理：把 https://tlwxpw.xyz 的请求转给本机 127.0.0.1:3000 的 Node 接口服务。
# 放到 /etc/nginx/conf.d/wedding.conf
#
# conf.d/*.conf 是被 include 进 http 块里的，所以下面这行 limit_req_zone 放在
# server 块外面是合法的（它必须在 http 上下文中声明，不能写进 server 里）。
#
# 这里只写 80 端口。HTTPS 证书由 certbot 自动申请并改写本文件，不用手写
# ssl_certificate 那几行（见 README 的部署步骤）。

limit_req_zone $binary_remote_addr zone=rsvp:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tlwxpw.xyz;

    # 报名接口做基础限流，防止有人刷接口把数据文件写爆。
    # 必须放在通用 location / 之前，nginx 才会优先匹配到它。
    location = /api/rsvp {
        limit_req zone=rsvp burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 接口服务只监听 127.0.0.1，外网只能经由这里进来
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
