# nginx 站点配置：wedding.taolinwei.com
# 放到 /etc/nginx/conf.d/wedding.conf
#
# 网页（静态文件）由 nginx 直接发，只有 /api/ 转给本机 127.0.0.1:3000 的 Node 服务。
# 这样网页和接口同源，不需要处理跨域。
#
# conf.d/*.conf 是被 include 进 http 块里的，所以 limit_req_zone 放在 server 块
# 外面是合法的（它必须在 http 上下文中声明，不能写进 server 里）。
#
# 这里只写 80 端口。HTTPS 证书由 certbot 自动申请并改写本文件，
# 不用手写 ssl_certificate 那几行（见 README 的部署步骤）。

limit_req_zone $binary_remote_addr zone=rsvp:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wedding.taolinwei.com;

    # 网站根目录就是 git 克隆下来的仓库
    root /var/www/wedding;
    index index.html;

    # —— 安全：仓库里不止有网页 ——
    # .git 目录含有全部历史（包括曾经提交过、后来删掉的图片），
    # server/ 含有服务端代码和宾客数据，两者都绝不能对外可读。
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ^~ /server/ {
        deny all;
    }

    # 报名接口做基础限流，防止有人刷接口把数据文件写爆。
    # 必须放在 /api/ 之前，nginx 才会优先匹配到这条精确路径。
    location = /api/rsvp {
        limit_req zone=rsvp burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 接口服务只监听 127.0.0.1，外网只能经由这里进来
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 图片/音频/图标文件名变更时会带上 ?v= 版本号，可以放心长期缓存
    location ~* \.(jpg|jpeg|png|ico|mp3|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 网页本身不缓存，改了内容宾客刷新就能看到
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
