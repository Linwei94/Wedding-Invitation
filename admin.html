<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>出席名单 · 婚礼请柬后台</title>
<link rel="icon" href="favicon.ico?v=3" sizes="16x16 32x32 48x48">
<meta name="theme-color" content="#7a1f1f">
<style>
  :root{
    --page:#f2ece1; --card:#fff; --ink:#3a2e26; --ink-soft:#7a6a58;
    --red:#7a1f1f; --red-soft:#8f2a2a; --line:#dccfb6; --field:#fbf8f2;
    --serif:"Noto Serif SC","Songti SC","STSong",serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:22px 16px 60px;
    background:var(--page); color:var(--ink);
    font-family:var(--serif);
  }
  .wrap{max-width:960px;margin:0 auto;}
  h1{font-size:21px;letter-spacing:4px;color:var(--red);margin:0 0 4px;font-weight:700;}
  .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 20px;}
  .panel{
    background:var(--card); border:1px solid var(--line);
    border-radius:5px; padding:18px; margin-bottom:16px;
  }
  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  input[type=password],input[type=search]{
    width:100%; padding:11px 12px; font-size:16px; font-family:inherit;
    border:1px solid var(--line); background:var(--field);
    color:var(--ink); border-radius:3px;
  }
  input:focus{outline:none;border-color:var(--red-soft);box-shadow:0 0 0 3px rgba(143,42,42,.09);}
  button{
    padding:11px 20px; font-size:14px; font-family:inherit; letter-spacing:2px;
    background:var(--red); color:#f7efe1; border:none; border-radius:3px;
    cursor:pointer; white-space:nowrap;
  }
  button.ghost{background:transparent;color:var(--red);border:1px solid var(--line);}
  button:disabled{opacity:.55;cursor:default;}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .row>div{flex:1;min-width:200px;}

  /* ---- 统计卡片 ---- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px;}
  .stat{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:14px 16px;}
  .stat b{display:block;font-size:28px;color:var(--red);font-weight:700;line-height:1.1;}
  .stat span{font-size:12px;color:var(--ink-soft);}

  /* ---- 图表 ---- */
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:700px){ .charts{grid-template-columns:1fr;} }
  .chart-title{font-size:13px;letter-spacing:2px;color:var(--red);margin:0 0 14px;font-weight:700;}

  .bars{display:flex;flex-direction:column;gap:9px;}
  .bar-row{display:grid;grid-template-columns:52px 1fr 42px;align-items:center;gap:10px;font-size:12.5px;}
  .bar-track{background:var(--field);border-radius:3px;height:20px;overflow:hidden;border:1px solid var(--line);}
  .bar-fill{height:100%;background:var(--red-soft);border-radius:2px 0 0 2px;transition:width .5s ease;}
  .bar-num{text-align:right;color:var(--ink-soft);}

  .spark{width:100%;height:130px;display:block;}
  .spark .line{fill:none;stroke:var(--red-soft);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .spark .area{fill:rgba(143,42,42,.10);stroke:none;}
  .spark .dot{fill:var(--red);}
  .spark .axis{stroke:var(--line);stroke-width:1;}
  .spark text{font-size:9px;fill:var(--ink-soft);font-family:var(--serif);}
  .chart-empty{font-size:12.5px;color:var(--ink-soft);padding:26px 0;text-align:center;}

  /* ---- 表格 ---- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar .grow{flex:1;min-width:180px;}
  .scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px;}
  th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top;}
  th{color:var(--ink-soft);font-weight:400;white-space:nowrap;cursor:pointer;user-select:none;}
  th:hover{color:var(--red);}
  th .arrow{opacity:.45;font-size:10px;}
  td.no{color:var(--ink-soft);}
  tr:hover td{background:var(--field);}
  .msg{font-size:13px;color:#b23b3b;margin-top:10px;}
  .empty{color:var(--ink-soft);font-size:13px;padding:18px 0;text-align:center;}
  .count-hint{font-size:12px;color:var(--ink-soft);margin:10px 0 0;}
  .count-hint.warn{color:#b23b3b;font-weight:700;}

  /* ---- 从备用通道导入 ---- */
  textarea{
    width:100%; padding:11px 12px; font-size:14px; font-family:inherit; line-height:1.7;
    border:1px solid var(--line); background:var(--field);
    color:var(--ink); border-radius:3px; resize:vertical;
  }
  .imp-list{margin:14px 0 0;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
  .imp-row{
    display:flex; gap:10px; align-items:flex-start;
    padding:9px 12px; font-size:13px; border-top:1px solid var(--line);
  }
  .imp-row:first-child{border-top:none;}
  .imp-row.dup{background:#fdf4f2;}
  .imp-row label{margin:0;font-size:13px;color:var(--ink);flex:1;cursor:pointer;}
  .imp-flag{color:#b23b3b;font-size:11.5px;display:block;margin-top:2px;}
  .imp-bad{
    margin:12px 0 0; padding:10px 12px; font-size:12.5px; line-height:1.8;
    background:#fdf4f2; border:1px solid #e8cdc6; border-radius:3px; color:#b23b3b;
    white-space:pre-wrap; word-break:break-all;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>出席名单</h1>
  <p class="sub">陶林伟 &amp; 肖佩韦 · 2026.10.17</p>

  <div class="panel" id="loginPanel">
    <div class="row">
      <div>
        <label for="token">管理口令（32 位以上随机串，不要用平时的密码）</label>
        <input type="password" id="token" autocomplete="off">
      </div>
      <button id="loadBtn">查看名单</button>
    </div>
    <p class="msg" id="msg" style="display:none"></p>
  </div>

  <div id="dataPanel" style="display:none">
    <div class="panel">
      <div class="stats">
        <div class="stat"><b id="sEntries">0</b><span>登记条数</span></div>
        <div class="stat"><b id="sPeople">0</b><span>出席总人数</span></div>
        <div class="stat"><b id="sAvg">0</b><span>平均每条人数</span></div>
      </div>
      <div class="charts">
        <div>
          <p class="chart-title">出席人数分布</p>
          <div class="bars" id="bars"></div>
        </div>
        <div>
          <p class="chart-title">每日登记趋势（累计）</p>
          <div id="trendWrap"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <div class="grow"><input type="search" id="search" placeholder="搜索姓名…"></div>
        <button class="ghost" id="csvBtn">导出 Excel（CSV）</button>
        <button class="ghost" id="refreshBtn">刷新</button>
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th data-sort="idx">#</th>
              <th data-sort="name">姓名 <span class="arrow"></span></th>
              <th data-sort="count">人数 <span class="arrow"></span></th>
              <th data-sort="updatedAt">登记时间 <span class="arrow"></span></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" style="display:none">还没有人登记。</p>
      <p class="count-hint" id="countHint"></p>
      <p class="count-hint" id="liveness"></p>
    </div>

    <div class="panel">
      <p class="chart-title">从备用通道导入</p>
      <p class="count-hint" style="margin:0 0 12px">
        宾客走了备用通道（微信发来的「【出席登记】…」整行，或国内备用表单导出的 CSV）时，
        把内容粘到这里。一行一条，两种格式可以混着放。解析后先让你确认，再写进服务器——
        这样名单永远只有一份，不会在这里和别处各存一半。
      </p>
      <textarea id="importText" rows="5" placeholder="【出席登记】姓名：张三｜人数：2
李四,3"></textarea>
      <div class="toolbar" style="margin-top:10px">
        <input type="file" id="importFile" accept=".csv,.txt">
        <button class="ghost" id="parseBtn">解析</button>
      </div>
      <div id="importReport"></div>
    </div>
  </div>
</div>

<script>
  // 和 index.html 里的 RSVP_ENDPOINT 填同一个地址，结尾不要带斜杠。
  // 例：'https://rsvp.taolinwei.com'
  var RSVP_ENDPOINT = '';

  // 结尾带斜杠也没关系，去掉，免得拼出 //api/list 这种匹配不上的路径。
  RSVP_ENDPOINT = String(RSVP_ENDPOINT).replace(/\/+$/, '');

  var tokenInput = document.getElementById('token');
  var msgEl = document.getElementById('msg');
  var loginPanel = document.getElementById('loginPanel');
  var dataPanel = document.getElementById('dataPanel');
  var loadBtn = document.getElementById('loadBtn');
  var searchEl = document.getElementById('search');
  var rows = [];
  var sortKey = 'updatedAt';
  var sortDir = -1;

  var saved = sessionStorage.getItem('rsvpAdminToken');
  if (saved) { tokenInput.value = saved; load(); }

  loadBtn.addEventListener('click', load);
  tokenInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
  document.getElementById('refreshBtn').addEventListener('click', load);
  document.getElementById('csvBtn').addEventListener('click', exportCsv);
  searchEl.addEventListener('input', renderTable);

  [].forEach.call(document.querySelectorAll('th[data-sort]'), function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort');
      if (key === 'idx') return;
      if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = 1; }
      renderTable();
    });
  });

  function load() {
    var token = tokenInput.value.trim();
    if (!token) return;
    if (!RSVP_ENDPOINT) {
      msgEl.textContent = '还没配置 RSVP_ENDPOINT——把 Worker 地址填进这个文件顶部那一行。';
      msgEl.style.display = 'block';
      return;
    }
    loadBtn.disabled = true;
    msgEl.style.display = 'none';

    // 不用 .finally()：它是 ES2017，在老浏览器里没有，一旦缺失会直接抛异常，
    // 把「查看名单」按钮永久禁用掉。放开按钮的动作写进两个分支里。
    fetch(RSVP_ENDPOINT + '/api/list', { headers: { 'x-admin-token': token } })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.ok) throw new Error(data.error || '读取失败');
        sessionStorage.setItem('rsvpAdminToken', token);
        rows = data.records || [];
        pending = [];
        document.getElementById('importReport').innerHTML = '';
        renderStats(data.summary || {});
        renderCharts();
        renderTable();
        renderLiveness();
        loginPanel.style.display = 'none';
        dataPanel.style.display = 'block';
        loadBtn.disabled = false;
      })
      .catch(function (err) {
        // 只有口令确实不对才清掉存着的口令。网络抖一下或者服务端 5xx 也清的话，
        // 刷新失败一次就得重新敲一遍 32 位随机串。
        if (String(err.message).indexOf('口令不正确') > -1) {
          sessionStorage.removeItem('rsvpAdminToken');
        }
        // 登录成功之后 msgEl 在已经 display:none 的 loginPanel 里，
        // 只写 textContent 是看不见的——「刷新失败」会变成完全静默。
        loginPanel.style.display = 'block';
        msgEl.textContent = err.message;
        msgEl.style.display = 'block';
        loadBtn.disabled = false;
      });
  }

  function renderStats(summary) {
    var entries = summary.entries || 0;
    var people = summary.attendingPeople || 0;
    document.getElementById('sEntries').textContent = entries;
    document.getElementById('sPeople').textContent = people;
    document.getElementById('sAvg').textContent = entries ? (people / entries).toFixed(1) : '0';
  }

  // 人数分布：1-5 人各有多少条登记
  function renderCharts() {
    var buckets = [0, 0, 0, 0, 0];
    rows.forEach(function (r) {
      var c = Math.min(Math.max(parseInt(r.count, 10) || 1, 1), 5);
      buckets[c - 1]++;
    });
    var max = Math.max.apply(null, buckets.concat([1]));
    var bars = document.getElementById('bars');
    bars.innerHTML = '';
    buckets.forEach(function (n, i) {
      var row = document.createElement('div');
      row.className = 'bar-row';
      var label = document.createElement('span');
      label.textContent = (i + 1) + ' 人';
      var track = document.createElement('div');
      track.className = 'bar-track';
      var fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.width = (n / max * 100) + '%';
      track.appendChild(fill);
      var num = document.createElement('span');
      num.className = 'bar-num';
      num.textContent = n;
      row.appendChild(label); row.appendChild(track); row.appendChild(num);
      bars.appendChild(row);
    });
    renderTrend();
  }

  // 累计登记趋势：按天聚合后画折线
  function renderTrend() {
    var wrap = document.getElementById('trendWrap');
    var byDay = {};
    rows.forEach(function (r) {
      var d = new Date(r.createdAt || r.updatedAt);
      if (isNaN(d)) return;
      var key = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      byDay[key] = (byDay[key] || 0) + 1;
    });
    var days = Object.keys(byDay).sort();
    if (days.length < 2) {
      wrap.innerHTML = '<p class="chart-empty">登记满两天后显示趋势</p>';
      return;
    }

    var cum = 0;
    var pts = days.map(function (d) { cum += byDay[d]; return { d: d, v: cum }; });
    var W = 320, H = 130, padL = 26, padR = 8, padT = 10, padB = 20;
    var maxV = pts[pts.length - 1].v;
    var x = function (i) { return padL + i * (W - padL - padR) / Math.max(pts.length - 1, 1); };
    var y = function (v) { return padT + (1 - v / maxV) * (H - padT - padB); };

    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p.v).toFixed(1); }).join(' ');
    var area = line + ' L' + x(pts.length - 1).toFixed(1) + ',' + (H - padB) + ' L' + x(0).toFixed(1) + ',' + (H - padB) + ' Z';
    var dots = pts.map(function (p, i) {
      return '<circle class="dot" cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="2.5"/>';
    }).join('');

    wrap.innerHTML =
      '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
        '<path class="area" d="' + area + '"/>' +
        '<path class="line" d="' + line + '"/>' + dots +
        '<line class="axis" x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '"/>' +
        '<text x="2" y="' + (padT + 4) + '">' + maxV + '</text>' +
        '<text x="2" y="' + (H - padB) + '">0</text>' +
        '<text x="' + padL + '" y="' + (H - 6) + '">' + short(days[0]) + '</text>' +
        '<text x="' + (W - padR) + '" y="' + (H - 6) + '" text-anchor="end">' + short(days[days.length - 1]) + '</text>' +
      '</svg>';
  }

  function short(d) { return d.slice(5).replace('-', '/'); }
  // 不用 String#padStart（ES2017），保持和 index.html 一样的 ES5 底线
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function visibleRows() {
    var q = searchEl.value.trim().toLowerCase();
    var list = rows.filter(function (r) {
      if (!q) return true;
      return (r.name || '').toLowerCase().indexOf(q) > -1;
    });
    list.sort(function (a, b) {
      var av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'count') { av = Number(av) || 0; bv = Number(bv) || 0; }
      else { av = String(av || ''); bv = String(bv || ''); }
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });
    return list;
  }

  function renderTable() {
    var list = visibleRows();
    var tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    list.forEach(function (r, i) {
      var tr = document.createElement('tr');
      [i + 1, r.name, r.count, fmt(r.updatedAt)].forEach(function (v, idx) {
        var td = document.createElement('td');
        if (idx === 0) td.className = 'no';
        td.textContent = v;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';

    var people = list.reduce(function (s, r) { return s + (Number(r.count) || 0); }, 0);
    document.getElementById('countHint').textContent =
      list.length === rows.length
        ? '共 ' + rows.length + ' 条登记，' + people + ' 人'
        : '筛选出 ' + list.length + ' / ' + rows.length + ' 条，' + people + ' 人';

    [].forEach.call(document.querySelectorAll('th[data-sort]'), function (th) {
      var a = th.querySelector('.arrow');
      if (!a) return;
      a.textContent = th.getAttribute('data-sort') === sortKey ? (sortDir > 0 ? '▲' : '▼') : '';
    });
  }

  function fmt(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function exportCsv() {
    var list = visibleRows();
    var head = ['姓名', '人数', '登记时间'];
    var lines = [head].concat(list.map(function (r) {
      return [r.name, r.count, fmt(r.updatedAt)];
    }));
    var csv = lines.map(function (cols) {
      return cols.map(cell).join(',');
    }).join('\r\n');

    // The BOM makes Excel read the file as UTF-8 instead of mangling Chinese.
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '出席名单.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // 除了转义引号，还要掐掉 Excel 的公式注入：万一姓名里出现
  // =HYPERLINK("http://坏地址")，双击打开 CSV 时 Excel 会把它当活公式执行。
  // 前面加个单引号就只当文本了。
  function cell(value) {
    var s = String(value == null ? '' : value);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }

  // ---- 状态指示：发现「静悄悄没人提交了」 ----
  //
  // 每一种静默故障（接口挂了、额度用光、备用表单被暂停）看起来都一样：没有新登记。
  // 而「这周没人登记」和「提交按钮已经坏了三周」在名单上长得完全一样，
  // 所以把「最近一条登记是多久前」显示出来，超过阈值标红。
  function renderLiveness() {
    var el = document.getElementById('liveness');
    if (!el) return;
    if (!rows.length) {
      el.textContent = '还没有任何登记。';
      el.className = 'count-hint warn';
      return;
    }
    var newest = 0;
    rows.forEach(function (r) {
      var t = new Date(r.updatedAt).getTime();
      if (t && t > newest) newest = t;
    });
    var days = Math.floor((Date.now() - newest) / 86400000);
    el.textContent = '最近一条登记：' + (days <= 0 ? '今天' : days + ' 天前');
    el.className = 'count-hint' + (days >= 7 ? ' warn' : '');
  }
  // ---- 从备用通道导入 ----
  //
  // 目的只有一个：让备用通道收到的登记最终也进到同一张表里。
  // 否则名单会被切成两半，一半在服务器、一半在某个微信聊天记录里，
  // 而给酒店报人数的时候只会看到其中一半。

  var pending = [];

  document.getElementById('parseBtn').addEventListener('click', function () {
    doParse(document.getElementById('importText').value);
  });

  document.getElementById('importFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || '').replace(/^﻿/, '');   // 去掉 Excel 的 BOM
      document.getElementById('importText').value = text;
      doParse(text);
    };
    reader.readAsText(file, 'utf-8');
  });

  function doParse(text) {
    var parsed = parseLines(text);
    pending = parsed.rows;
    renderImportReport(parsed);
  }

  function parseLines(text) {
    var out = { rows: [], bad: [] };
    splitRecords(text).forEach(function (rec) {
      var line = rec.text.trim();
      if (!line) return;
      // 引号没闭合就到了结尾：这条是残缺的，报出来让人看，不要当成一位宾客
      if (rec.broken) { out.bad.push(rec.text); return; }
      var r = parseReceipt(line) || parseDelimited(line);
      if (r && r.name) out.rows.push(r);
      else out.bad.push(rec.text);       // 认不出来的原样报出去，绝不悄悄丢掉
    });
    return out;
  }

  // 按「引号外面的换行」切记录，不能直接 split(/\r?\n/)。
  // Excel 导出带换行的单元格是用引号包住、里面真的有换行的，先按行切会把一条记录
  // 劈成「被截断的一条」+「凭空多出来的一位宾客」——多出来的那位最难发现。
  function splitRecords(text) {
    var s = String(text == null ? '' : text);
    var out = [], cur = '', inQ = false;
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      if (ch === '"') {
        if (inQ && s.charAt(i + 1) === '"') { cur += '""'; i++; continue; }
        inQ = !inQ; cur += ch; continue;
      }
      if (!inQ && (ch === '\n' || ch === '\r')) {
        if (ch === '\r' && s.charAt(i + 1) === '\n') i++;
        out.push({ text: cur, broken: false });
        cur = '';
        continue;
      }
      cur += ch;
    }
    if (cur !== '' || inQ) out.push({ text: cur, broken: inQ });
    return out;
  }

  // 【出席登记】姓名：张三｜人数：2
  // 全角｜：和半角|: 都要认——中文输入法、手工重打、各家客户端都可能产出半角那版，
  // 只认全角的正则在真实数据上会直接返回 null。
  function parseReceipt(line) {
    if (line.indexOf('姓名') < 0) return null;
    var s = line.replace(/｜/g, '|').replace(/：/g, ':');
    var name = grab(s, /姓名\s*:\s*([^|]*)/);
    if (!name) return null;
    return {
      name: name,
      count: grab(s, /人数\s*:\s*([^|]*)/)
    };
  }

  function grab(s, re) { var m = s.match(re); return m ? m[1].trim() : ''; }

  // CSV 或制表符分隔：姓名,人数
  function parseDelimited(line) {
    var cols = line.indexOf('\t') > -1 ? line.split('\t') : splitCsv(line);
    // 必须真的带分隔符。否则从微信里多选复制时捎带进来的闲聊，每一行都会变成
    // 一位「宾客」，把报给酒店的人数抬高——凭空多出来的人比漏掉的人更难核对出来。
    // 只写了名字、没写人数的行会进下面的「没认出来」清单，人看见补个 ",1" 即可，不会丢。
    if (cols.length < 2) return null;
    var name = String(cols[0] || '').trim().replace(/^["']|["']$/g, '');
    if (!name || name === '姓名') return null;    // 跳过表头
    return {
      name: name,
      count: String(cols[1] == null ? '' : cols[1]).trim()
    };
  }

  function splitCsv(line) {
    var out = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line.charAt(i);
      if (inQ) {
        if (ch === '"') {
          if (line.charAt(i + 1) === '"') { cur += '"'; i++; } else { inQ = false; }
        } else { cur += ch; }
      } else if (ch === '"') { inQ = true; }
      else if (ch === ',') { out.push(cur); cur = ''; }
      else { cur += ch; }
    }
    out.push(cur);
    return out;
  }

  // 必须和服务端 clampCount 的解析方式一致，否则预览显示的人数会和真正写进去的不一样。
  // 先按 parseInt 原样解析（这样 '-3' 是 -3，会被收成 1；'2人' 也能直接得到 2），
  // 只有完全解析不出来时才退回「把非数字都去掉」。
  function normCount(v) {
    var s = String(v == null ? '' : v).trim();
    var n = parseInt(s, 10);
    if (!isFinite(n)) n = parseInt(s.replace(/[^0-9]/g, ''), 10);
    if (!isFinite(n) || !n) return 1;
    return Math.min(Math.max(n, 1), 5);
  }

  function renderImportReport(parsed) {
    var box = document.getElementById('importReport');
    box.innerHTML = '';
    if (!parsed.rows.length && !parsed.bad.length) return;

    var existing = {};
    rows.forEach(function (r) { existing[r.name] = true; });

    if (parsed.rows.length) {
      var list = document.createElement('div');
      list.className = 'imp-list';
      parsed.rows.forEach(function (r, i) {
        var dup = !!existing[r.name];
        var row = document.createElement('div');
        row.className = 'imp-row' + (dup ? ' dup' : '');

        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = 'imp' + i;
        // 同名的默认不勾。写入是按姓名覆盖的，一个婚礼上「张伟」很可能真是两个人，
        // 自动合并会把先登记那位的人数直接抹掉，所以这里必须让人来定。
        cb.checked = !dup;
        cb.setAttribute('data-i', String(i));

        var label = document.createElement('label');
        label.setAttribute('for', cb.id);
        label.textContent = r.name + '　' + normCount(r.count) + ' 人';
        if (dup) {
          var flag = document.createElement('span');
          flag.className = 'imp-flag';
          flag.textContent = '疑似重名：名单里已经有「' + r.name
            + '」了。勾上会覆盖那一条，确认是同一个人再勾。';
          label.appendChild(flag);
        }

        row.appendChild(cb);
        row.appendChild(label);
        list.appendChild(row);
      });
      box.appendChild(list);

      var writeBtn = document.createElement('button');
      writeBtn.style.marginTop = '12px';
      writeBtn.textContent = '写入服务器';
      writeBtn.addEventListener('click', function () { writePending(writeBtn); });
      box.appendChild(writeBtn);
    }

    if (parsed.bad.length) {
      var bad = document.createElement('div');
      bad.className = 'imp-bad';
      bad.textContent = '有 ' + parsed.bad.length + ' 行没认出来，没有被导入。'
        + '请检查或手工改成「姓名,人数」再试：\n\n' + parsed.bad.join('\n');
      box.appendChild(bad);
    }
  }

  // 逐条走正常的登记接口写进去，所以导入的记录和网站上提交的记录完全一样，
  // 一并进备份，也一并出现在导出的 CSV 里。
  function writePending(btn) {
    var picked = [];
    [].forEach.call(document.querySelectorAll('#importReport input[type=checkbox]'), function (cb) {
      if (cb.checked) picked.push(pending[Number(cb.getAttribute('data-i'))]);
    });
    if (!picked.length) return;

    btn.disabled = true;
    var okCount = 0, failed = [];

    function next(i) {
      if (i >= picked.length) {
        var report = document.createElement('div');
        report.className = failed.length ? 'imp-bad' : 'count-hint';
        report.textContent = '写入成功 ' + okCount + ' 条'
          + (failed.length ? '，失败 ' + failed.length + ' 条：' + failed.join('、') : '。')
          + (failed.length ? '' : ' 正在刷新名单…');
        document.getElementById('importReport').appendChild(report);
        btn.disabled = false;
        if (!failed.length) {
          document.getElementById('importText').value = '';
          setTimeout(load, 700);
        }
        return;
      }
      var r = picked[i];
      btn.textContent = '写入中… (' + (i + 1) + '/' + picked.length + ')';
      fetch(RSVP_ENDPOINT + '/api/rsvp', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({ name: r.name, count: normCount(r.count) })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data && data.ok) okCount++; else failed.push(r.name);
        })
        .catch(function () { failed.push(r.name); })
        .then(function () { next(i + 1); });
    }
    next(0);
  }
</script>
</body>
</html>
